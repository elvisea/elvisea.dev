name: CI

# Actions fixadas por SHA (com a tag no comentário). O Dependabot abre PR
# quando sai versão nova. Motivo: tags mutáveis permitem troca silenciosa do
# código executado (caso trivy-action, GHSA-69fq-xp46-6x23, mar/2026).

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "CHANGELOG.md"
  push:
    branches: [develop]
    paths-ignore:
      - ".claude/**"
      - ".cursor/**"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "README.md"
      - "CHANGELOG.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:check

      - name: Scan Dockerfile and compose misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Scan filesystem for CVEs and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  check:
    name: Lint, Format, Types, Test, Build
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Type check
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun --bun run build
